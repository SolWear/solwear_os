; SolWearOS - Smartwatch OS for Waveshare RP2040-Touch-LCD-1.69
; Hardware: ST7789V2 240x280, CST816S touch, QMI8658 IMU, PN532 NFC

[env:solwearos]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 2m
board_build.f_cpu = 133000000L
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
upload_protocol = picotool

build_flags =
    ; --- TFT_eSPI configuration (no User_Setup.h needed) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=280
    -DTFT_MOSI=11
    -DTFT_SCLK=10
    -DTFT_CS=9
    -DTFT_DC=8
    -DTFT_RST=13
    -DTFT_BL=25
    -DTOUCH_CS=-1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    ; --- Fonts ---
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; --- Optimization ---
    -Os
    -DARDUINO_ARCH_RP2040=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit PN532@^1.3.3
    ricmoo/QRCode@^0.0.1

monitor_speed = 115200
