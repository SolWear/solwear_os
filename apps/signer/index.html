<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="stylesheet" href="styles.css" />
    <title>Signer</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Solana wallet</p>
        <h1 id="key" class="key">connecting…</h1>
      </header>

      <section class="message">
        <p class="label">Message</p>
        <textarea id="message" rows="2" aria-label="Message to sign">Hello from SolWear</textarea>
      </section>

      <button id="sign" class="sign" disabled>Sign</button>

      <button id="nfc" class="nfc" disabled>Arm NFC</button>

      <p id="status" class="status" role="status"></p>
      <p id="signature" class="signature"></p>
      <section class="history"><p class="label">Recent activity</p><div id="activity">No signatures yet</div></section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
