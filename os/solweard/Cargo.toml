[package]
name = "solweard"
version = "0.1.0"
edition = "2021"
description = "SolWear OS system daemon: JSON-RPC API, HAL, app lifecycle, wallet"
license = "Apache-2.0"

# Standalone crate: never absorbed into a parent workspace that a sibling
# component might introduce at the repository root.
[workspace]

[dependencies]
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal", "process"] }
axum = { version = "0.7.9", features = ["ws"] }
futures-util = "0.3.30"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
sha2 = "0.10.8"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8.5"
bs58 = "0.5.1"
base64 = "0.22.1"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
zeroize = "1.8.1"
anyhow = "1.0.89"
thiserror = "1.0.64"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.13.0"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
